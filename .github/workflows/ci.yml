# Runs the full check list from CLAUDE.md on every push and pull request.
name: CI

on:
  push:
    branches: [main, "m1-*"]   # main, plus the milestone 1 stage branches
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: Full check list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.15,<1.16" "pytest>=8,<10" "ruff>=0.12,<1"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (all features)
        run: cargo test --workspace --all-features

      - name: cargo clippy and cargo test with --features rerun
        run: |
          cargo clippy --workspace --all-targets --features sw-log/rerun -- -D warnings
          cargo test --workspace --features sw-log/rerun

      - name: Build the Python module into a virtual environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.15,<1.16"
          maturin develop --release --extras dev

      - name: ruff check
        run: |
          . .venv/bin/activate
          ruff check python tests

      - name: pytest
        run: |
          . .venv/bin/activate
          pytest
