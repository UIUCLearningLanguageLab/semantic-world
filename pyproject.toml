# Python package for Semantic World, built by maturin. See docs/specs/MILESTONE_1.md, "Technology".
# Versions are pinned to the minor version, as checked on 2026-09-27. Upgrade deliberately.

[build-system]
requires = ["maturin>=1.15,<1.16"]
build-backend = "maturin"

[project]
name = "semantic_world"
description = "An artificial world for comparing cognitive models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dynamic = ["version"]  # taken from the Rust workspace version (crates/sw-py/Cargo.toml)
authors = [{ name = "Jon Willits", email = "jwillits@illinois.edu" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy>=2.0,<3",
    "pyarrow>=21,<26",
    "polars>=1.30,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.15,<1.16",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "gymnasium>=1.3,<1.4",
    "pettingzoo>=1.27,<1.28",
    "rerun-sdk>=0.38,<0.39",
]

# The word-form pipeline (docs/specs/WORDFORM_PIPELINE.md). The taxonomy generator does not need
# this extra. espeak-ng is a system program: brew install espeak-ng. piper-tts is GPL-3.0; it is
# imported only in python/semantic_world/wordforms/synth/piper.py.
speech = [
    "cmudict>=1.1,<1.2",
    "wordfreq>=3.1,<3.2",
    "scipy>=1.18,<1.19",
    "soundfile>=0.14,<0.15",
    "piper-tts>=1.8,<1.9",
    "torch>=2.14,<2.15",
    "transformers>=5.17,<5.18",
]

[project.urls]
Repository = "https://github.com/UIUCLearningLanguageLab/semantic-world"

[tool.maturin]
python-source = "python"
module-name = "semantic_world._core"
manifest-path = "crates/sw-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B027"]  # optional hooks on the NervousSystem base class are empty on purpose

[tool.ruff.lint.isort]
known-first-party = ["semantic_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
