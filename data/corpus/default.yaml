# The default corpus: 10,000 documents about the default world (the default relations taxonomy
# with scalar dimensions, one-place and two-place event types, and fluents). Every parameter
# appears with its default value. See docs/specs/CORPUS_GENERATOR.md and
# docs/specs/WORLD_AND_LANGUAGE.md ("Phase (a): the corpus"). Paths are read from the folder
# the command runs in: run from the root of the repository.

name: default
seed: 1                          # the corpus's master seed, independent of the world's seed

# The world the corpus is about: a world configuration file and a seed, defined in memory (seed:
# null uses the seed in the world file). Or a world run folder, which is regenerated in memory
# and checked against its files: {run: runs/world/default_seed1}.
world: {config: data/world/default.yaml, seed: 1}

lexicon:
  # the proportion of concepts of each type that get a word (state: stage a7)
  named_proportion: {category: 1.0, property: 1.0, part: 1.0, state: 1.0, event_unary: 1.0, event: 1.0, event_category: 1.0, patient_projection: 0.25, scalar: 1.0}
  synonym_rate: 0.0              # the probability that a content concept gets a second lexeme
  homonym_rate: 0.0              # the probability that a content lexeme shares its word form
  homonym_same_pos: 0.5          # the share of homonym pairs within one part of speech

documents:
  count: 10000
  mix: {encyclopedic_category: 0.3, encyclopedic_feature: 0.2, entity: 0.2, situational: 0.3}
  sentences: {encyclopedic_category: [5, 15], encyclopedic_feature: [5, 15], entity: [5, 20], situational: [5, 20]}
  topic_level_weights: {schedule: linear, start: 1, end: 2}   # weights over category levels for category topics
  shuffle: 0.3                   # 0: encyclopedic documents follow the template order; 1: a random order
  instance_description_rate: 0.2 # the probability that an event sentence of a narrative is followed by a description
  sibling_contrast_rate: 0.2     # the probability that a fact in a category document is followed by the matching fact about a sibling
  relation_fact_share: null      # the share of a category document's sentences that draw a relation fact; null: relation facts are weighted like the other kinds; 0: none
  content_kind_weights: equal          # how a category document draws its next kind of content: each kind with the same chance (equal), or in proportion to the facts of each kind it can still state (proportional)
  progressive_rate: 0.3          # the share of event reports that are progressive; each report chooses its aspect
  one_aspect_per_event: true     # every report of one event in one document uses the aspect of its first report

propositions:
  negation_rate: {class: 0.1, instance: 0.1}
  rule_statement_rate: 0.3       # share of feature-topic sentences that state rules
  rule_statements: {max_literals: null}   # a number skips the rule terms with more literals; null: no cap
  restriction_rate: 0.1          # the probability that a class-level subject takes a restriction ("red penguins")
  events: {tense: past}          # the tense of every event (past or present)

# The language's quantifier words. These settings decide what the words mean, never what a proposition means.
quantifiers:
  universal_words: nec           # what "all" and "no" express: nec (NEC_ALL, NEC_NO), extensional (ALL, NO), or either
  most: {usage_min: 0.7}         # a speaker says "most" only at or above this share; MOST itself is true above one half
  some: {exclude_all: true}
  bare_plural: {expresses: [most]}   # the quantifiers a bare plural can express (nec_all, all, most, some); membership and rule statements may always use it, for nec_all
  generic_rate: 0.5              # share of class-level sentences that use a bare plural when it can express their quantifier
  weights: {nec_all: 1.0, all: 1.0, most: 1.0, some: 1.0, none: 1.0, nec_none: 1.0}   # how often a document states the facts of each quantifier (none: "no", nec_none: "nec_no"); equal weights change nothing

scene:
  size: [2, 6]
  steps: [3, 8]
  events_per_step: 1.5
  transitive_share: 0.5          # used by the uniform_event_type policy
  event_type_weights: uniform    # or a mapping from event types to weights
  participant_weights: {thematic: 1.0, taxonomic: 0.5, constant: 0.1}
  policy: uniform_event          # the selection policy: uniform_event (uniform over all legal events) or uniform_event_type (the kind, then the event type, then a binding)
  initial: keep                  # keep: scenes start from the entities' initial values; redraw: each scene redraws its participants' initial values

entity:
  scenes: [2, 5]                 # the number of scenes of an entity narrative

# How referents are mentioned. These settings can change what a sentence says.
mention:
  level_weights: {schedule: linear, start: 1, end: 4}         # noun levels, heaviest at the leaf level
  event_level_weights: {schedule: linear, start: 1, end: 4}   # event-type levels for naming events, heaviest at the leaf (the event type)
  pronoun_rate: 0.5
  modifier_rate: 0.3
  max_adjectives: 3
  max_with_phrases: 2
  max_content_words: 20          # nouns, adjectives, and verbs in one sentence
  relative_clauses: {rate: 0.1, max_depth: 1, object_share: 0.3}

# How a logical form is realized. These settings never change what a sentence says.
grammar:
  adjective_order: {fixed: true}
  can_rate: {class: 0.5, instance: 1.0}   # share of positive capacities that say "can"; below 1 at the instance level, "the penguin swim" is ambiguous
  word_order: {clause: SVO, determiner: before, adjective: before, with_phrase: after, relative_clause: after, adposition: preposition, auxiliary: before, negation: after_auxiliary}
  morphology:
    number: {enabled: false, realization: affix, position: after, agreement: true, verb_marks: plural}   # verb_marks: plural or singular (English)
    tense: {enabled: false, realization: affix, position: after}    # whether and how the past is marked
    aspect: {enabled: false, realization: word, position: after}    # whether and how the progressive is marked

scalar_adjectives: {z: 1.0}

renderings:
  propositional: {referents: local}   # local (REF.1, REF.2, ... within each document) or instance (entity labels)

test_sets:
  size: 500                      # true items per set; each gets one matched false item
  changes: [predicate, subject, quantifier, role]
