# The tiny taxonomy with 1 scalar dimension: small enough to check by brute force over every pair
# of instances. The tiny world (data/world/tiny.yaml) builds on it.

name: tiny_relations
seed: 1

features:
  is:  {count: 8, proportion_determined: 0.25, expected_true_free: 2}
  has: {count: 8, proportion_determined: 0.25, expected_true_free: 2}
  base_rate_heterogeneity: null  # equal base rates: with 6 free features of a type, heterogeneous rates can leave a
                                 # superordinate with no true feature, which the similarity bound cannot place

taxonomy:
  superordinates: 2
  depth: 2
  branching: 2

instances:
  per_leaf: 3

scalars:
  count: 1
