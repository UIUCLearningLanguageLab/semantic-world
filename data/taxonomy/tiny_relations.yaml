# The tiny taxonomy with 1 scalar, 4 verb features, and a verb tree of 2 superordinates with 2
# verbs each: small enough to check by brute force over every pair of instances.

name: tiny_relations
seed: 1

features:
  is:  {count: 8, proportion_determined: 0.25, expected_true_free: 2}
  has: {count: 8, proportion_determined: 0.25, expected_true_free: 2}
  can: {count: 4}

taxonomy:
  superordinates: 2
  depth: 2
  branching: 2

instances:
  per_leaf: 3

scalars:
  count: 1

verbs:
  features: {count: 4, expected_true: 2}
  taxonomy: {superordinates: 2, depth: 2, branching: 2}
