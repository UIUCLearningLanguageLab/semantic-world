# A taxonomy small enough to read by eye: 2 superordinates, depth 2, 8 PROPERTY and 8 PART
# features, and 3 instances per leaf. Parameters not listed keep their defaults (see default.yaml).

name: tiny
seed: 1

features:
  property:  {count: 8, proportion_determined: 0.25, expected_true_free: 2}
  part: {count: 8, proportion_determined: 0.25, expected_true_free: 2}
  base_rate_heterogeneity: null  # equal base rates: with 6 free features of a type, heterogeneous rates can leave a
                                 # superordinate with no true feature, which the similarity bound cannot place

taxonomy:
  superordinates: 2
  depth: 2
  branching: 2

instances:
  per_leaf: 3
