# ARPAbet to IPA, in espeak-ng's General American conventions, so that the strings match what
# Piper's English voices were trained on. A key with a stress digit (AH0) overrides the plain
# key (AH) for vowels carrying that stress. Stress marks are written by the pipeline, before the
# stressed vowel, as espeak-ng writes them.
stress: {primary: "ˈ", secondary: "ˌ"}
phonemes:
  AA: "ɑː"
  AE: "æ"
  AH: "ʌ"
  AH0: "ə"
  AO: "ɔː"
  AW: "aʊ"
  AY: "aɪ"
  B: "b"
  CH: "tʃ"
  D: "d"
  DH: "ð"
  EH: "ɛ"
  ER: "ɜː"
  ER0: "ɚ"
  EY: "eɪ"
  F: "f"
  G: "ɡ"
  HH: "h"
  IH: "ɪ"
  IY: "iː"
  IY0: "i"
  JH: "dʒ"
  K: "k"
  L: "l"
  M: "m"
  N: "n"
  NG: "ŋ"
  OW: "oʊ"
  OY: "ɔɪ"
  P: "p"
  R: "ɹ"
  S: "s"
  SH: "ʃ"
  T: "t"
  TH: "θ"
  UH: "ʊ"
  UW: "uː"
  V: "v"
  W: "w"
  Y: "j"
  Z: "z"
  ZH: "ʒ"
