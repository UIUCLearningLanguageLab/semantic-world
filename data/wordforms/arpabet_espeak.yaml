# ARPAbet to espeak-ng phoneme mnemonics for the en-us voice, for input inside [[ ]]. A key with
# a stress digit (AH0) overrides the plain key (AH) for vowels carrying that stress. Stress marks
# are written by the pipeline, before the stressed vowel, as espeak-ng expects them.
stress: {primary: "'", secondary: ","}
phonemes:
  AA: "A:"
  AE: "a"
  AH: "V"
  AH0: "@"
  AO: "O:"
  AW: "aU"
  AY: "aI"
  B: "b"
  CH: "tS"
  D: "d"
  DH: "D"
  EH: "E"
  ER: "3:"
  ER0: "3"
  EY: "eI"
  F: "f"
  G: "g"
  HH: "h"
  IH: "I"
  IY: "i:"
  IY0: "i"
  JH: "dZ"
  K: "k"
  L: "l"
  M: "m"
  N: "n"
  NG: "N"
  OW: "oU"
  OY: "OI"
  P: "p"
  R: "r"
  S: "s"
  SH: "S"
  T: "t"
  TH: "T"
  UH: "U"
  UW: "u:"
  V: "v"
  W: "w"
  Y: "j"
  Z: "z"
  ZH: "Z"
