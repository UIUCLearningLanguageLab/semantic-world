# A one-day smoke run: one random agent in the meadow.
experiment: m1_smoke
version: 1
world: ../worlds/meadow.yaml
population:
  - {type: human, count: 1, nervous_system: {module: random}}
views: {propositional_sensor: false, speech_as_symbols: false}
options:
  impossible_actions: masked             # masked | attempt_and_fail
  touch_detail: whole_body
  death: ends_lifetime
clock: {mode: synchronous, tick_s: 0.1, decision_every_ticks: 2}
lifetime: {default_days: 1}
logging: {state_every_ticks: 10, images: off, internals: every_decision}
# Homeostatic drive reduction (contract 4). The exponents n and m are PROVISIONAL (decided
# 2026-09-27) and are expected to change with the first study.
reward: {module: homeostatic, params: {n: 4, m: 3}}
seeds: [0]
