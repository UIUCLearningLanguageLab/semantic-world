# A worked example of an event file (docs/specs/WORLD_AND_LANGUAGE.md, "Explicit event types").
# Over abstract labels, it builds a chain: EVENTTYPE2.1.1 ("catch") needs an awake agent and an
# uncaught patient and marks the patient caught; EVENTTYPE2.1.2 ("eat") needs an awake agent and a
# caught patient and puts the patient to sleep for good. Both share one explicit requirement, that
# the agent is bigger than the patient on the first scalar, so whatever is caught can be eaten and
# the chain completes on every seed (the two event types are siblings, so they also share their
# parent's base relation). Event types not listed are sampled. Use it with the tiny world:
# event_types.event_file: events/chain_example.yaml, relative to the configuration file's folder.

fluents:
  BOOLFL.1: {initial_rate: 1.0}        # say, awake
  BOOLFL.2: {initial_rate: 0.0}        # say, caught
event_types:
  EVENTTYPE2.1.1:
    requirement: "agent.SCALARDIM.1 - patient.SCALARDIM.1 > 0.0"
    precondition: "agent.BOOLFL.1 AND NOT patient.BOOLFL.2"
    effects: ["patient.BOOLFL.2 := 1"]
  EVENTTYPE2.1.2:
    requirement: "agent.SCALARDIM.1 - patient.SCALARDIM.1 > 0.0"
    precondition: "agent.BOOLFL.1 AND patient.BOOLFL.2"
    effects: ["patient.BOOLFL.1 := 0"]
