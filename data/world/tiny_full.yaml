# The tiny world with the phase (c) settings of docs/specs/WORLD_PHASE_C.md, "Configuration":
# the settings of tiny.yaml plus 2 pair fluents between entities (stage c2b; the location
# settings come in stage c3). The tiny corpus keeps running on tiny.yaml, which has no pair
# fluents, until stage c4 extends the corpus's truth oracle to pairs and moves these settings
# into tiny.yaml (Jon's ruling WM.63). Parameters not listed keep their defaults.

name: tiny_full
seed: 1
taxonomy: {config: data/taxonomy/tiny_relations.yaml}
places: {taxonomy: {config: data/taxonomy/places_tiny.yaml}}
place_event_types: {count: 2}

fluents:
  count: 4

event_types:
  unary: {count: 4}
  binary:
    features: {count: 4, expected_true: 2}
    taxonomy: {superordinates: 2, depth: 2, branching: 2}

pair_fluents: {count: 2}
