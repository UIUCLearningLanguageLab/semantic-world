# The tiny world with the phase (c) settings of docs/specs/WORLD_PHASE_C.md, "Configuration":
# the settings of tiny.yaml plus 2 pair fluents between entities (stage c2b), 1 location fluent
# (stage c3b), so its 2 place event types are a move or an act each, with drawn dynamics, and,
# since the stage c3b follow-up of October 28, 2026 (Jon's ruling WM.67), the density band of the
# place requirements ([0.05, 0.5]: a requirement that holds for fewer than 3 or more than 24 of
# the 48 bindings of an entity and a place is drawn again) and a habitat strength of 2, so that
# the habitats are not flat. The tiny corpus keeps running on tiny.yaml, which has no pair
# fluents, until stage c4 extends the corpus's truth oracle to pairs and moves these settings
# into tiny.yaml (Jon's ruling WM.63). The two files differ in the pair_fluents block,
# places.habitat_strength, and place_event_types.density alone (a test checks it): the place
# requirements read the place in both (WM.62). Parameters not listed keep their defaults.

name: tiny_full
seed: 1
taxonomy: {config: data/taxonomy/tiny_relations.yaml}
places: {taxonomy: {config: data/taxonomy/places_tiny.yaml}, habitat_strength: 2}
place_event_types: {count: 2, constraint_families: {patient: 1, cross: 1, key_lock: 1}, density: [0.05, 0.5]}

fluents:
  count: 4

event_types:
  unary: {count: 4}
  binary:
    features: {count: 4, expected_true: 2}
    taxonomy: {superordinates: 2, depth: 2, branching: 2}

pair_fluents: {count: 2, locations: 1}
