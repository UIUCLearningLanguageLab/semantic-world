# The tiny world with the chain example's explicit event types.

name: tiny_chain
seed: 1
taxonomy: {config: data/taxonomy/tiny_relations.yaml}

fluents:
  count: 4

event_types:
  unary: {count: 4}
  binary:
    features: {count: 4, expected_true: 2}
    taxonomy: {superordinates: 2, depth: 2, branching: 2}
  event_file: events/chain_example.yaml
